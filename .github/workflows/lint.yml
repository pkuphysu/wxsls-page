name: Lint Code

on:
  push:
    paths-ignore:
      - "**.md"

jobs:
  lint:
    name: lint code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Node.js for use with actions
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install package
        run: npm ci
      - name: Lint
        run: npm run lint
